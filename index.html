function how(){scr('Как играть',`<div class="lg"><b>Цель</b><ul><li>Соревновательный режим 3×3 до 13 побед, максимум 24 раунда. После 12 раунда стороны меняются, деньги сбрасываются.</li><li>Узай прячет жир-бомбу на точке A или B, а ты, Андрей, должен её остановить. Сначала команда Андрея защищает.</li></ul><b>Раунд</b><ul><li>10 секунд подготовки: закупка на B. Затем 1 минута на раунд.</li><li>Атака закладывает бомбу: держи E 3 секунды на точке. Бомба взрывается через 40 секунд.</li><li>Защита обезвреживает бомбу: держи E 5 секунд рядом с ней, стоя на месте.</li><li>Защита побеждает, если бомба обезврежена, время вышло до закладки или атака уничтожена до закладки. Атака побеждает, если бомба взорвалась или защитники убиты.</li></ul><b>Оружие и урон</b><ul><li>Слот 1 — автоматы (MP9, AK-47, M4A4): 1 в голову или 2 в тело.</li><li>Слот 2 — пистолеты (P2000, Desert Eagle): 2 в голову или 4 в тело.</li><li>Слот 3 — нож: ЛКМ удар (40 урона, в спину 100). Слоты 4, 5, 6 — осколочная, светошумовая и дымовая гранаты (выбор цифрой и бросок ЛКМ, либо быстрый бросок на G). У всех по 100 HP.</li></ul><b>Деньги</b><ul><li>Победа в раунде $3250, поражение $1900, убийство и закладка $300, максимум $9000.</li></ul><b>Управление на компьютере</b><ul><li>WASD движение, мышь обзор, ЛКМ огонь/бросок, 1–6 выбор слота (автомат, пистолет, нож, осколочная, светошумовая, дымовая), Ctrl или C (держать) — присесть, R перезарядка, E (держать) закладка и обезвреживание, G быстрый бросок гранаты, B закупка, Esc пауза, Tab (держать) — таблица игроков: убийства, смерти, K/D, урон. Стрелки тоже поворачивают камеру.</li></ul><b>Мультиплеер</b><ul><li>Главное меню, «Мультиплеер (по сети)»: введи ник и нажми «Создать комнату» либо введи код друга и «Войти по коду». Хост считает игру, поэтому у него лучше соединение — меньше задержка. Нужен интернет; при строгих сетях (мобильный интернет, корпоративный Wi‑Fi) прямое соединение иногда невозможно.</li></ul><b>Управление на телефоне</b><ul><li>Левым пальцем двигайся (джойстик появляется там, где коснулся), правым поворачивай камеру. Справа внизу кнопки «Огонь» и «Присед». Кнопка «Купить» появляется только в первые 10 секунд раунда. Панель слотов над нижней строкой: тап по слоту — сменить оружие, нож или гранату. Закладка и обезвреживание идут сами, пока ты стоишь на месте у точки или бомбы; перезарядка тоже сама.</li></ul></div>`,[['Назад',menu]])}
function log(){scr('Лог версий',`<div class="lg"><b>v1.2. Мультиплеер</b><ul><li>Сетевая игра до 6 человек (3 на 3) через WebRTC. Знакомство игроков идёт через бесплатный облачный сервер PeerJS, потом данные идут напрямую. Один игрок создаёт комнату и сообщает друзьям 5-значный код</li><li>В комнате: выбор стороны (защита или атака), чат, переключатель «Автозаполнение ботами» и выбор карты у хоста. Во время матча чат открывается клавишей Enter</li><li>Свободные места занимают боты, либо остаются пустыми, если автозаполнение выключено (тогда в каждой команде нужен хотя бы один человек)</li><li>Если игрок вышел из матча, его место занимает бот. Если вышел хост, матч заканчивается</li></ul><b>v1.1. Детализация, нож, гранаты, новое управление на телефоне</b><ul><li>Нож (слот 3): удар ЛКМ 40 урона, в спину наповал. Со стволом на ноже бегаешь быстрее</li><li>Светошумовая (слот 5): ослепляет всех, кто смотрит на вспышку, и временно лишает ботов зрения. Дымовая (слот 6): плотное облако на 17 секунд, закрывает обзор игроку и ботам. Осколочная теперь слот 4</li><li>Боты используют светошумовые и дымовые: кидают флеш при встрече, дым на пути и на бомбу при разминировании</li><li>Больше деталей: оружие (прицелы, насечки, рейки, магазины), персонажи (рюкзаки, повязки, перчатки, подбородочные ремни, фляги), стены (окна со ставнями, кирпичная кладка, заклёпки, трещины), новые предметы: горшки и скамейки, цветы на кустах, кокосы на пальмах</li><li>Телефон: остались только джойстик, огонь, присед и «Купить» (только первые 10 секунд). Закладка и обезвреживание автоматические: встань на месте, перезарядка тоже автоматическая. Смена оружия и гранат — компактная панель слотов</li><li>Скины: добавлен нож</li></ul><b>v1.0. Новая карта, умные боты, скины и таблица игроков</b><ul><li>Новая карта «Шестерские мечты» — копия Mirage: спавн Т, рампа и Палас на A, Кэтвок, Джангл, Окно, Мид, Андерпасс, апартаменты и Маркет на B. Карта выбирается в главном меню, Dust остался</li><li>Боты полностью переписаны: идут на точки по разным маршрутам (рампа, кэтвок, апартаменты, андерпасс, мид), защита патрулирует и реагирует на звуки выстрелов, больше никакого верчения головой на месте</li><li>Боты не наводятся мгновенно: есть время реакции, прицел улучшается по ходу боя. Но стреляют с остановки и стали реально убивать; запасной бот закладывает бомбу, если закладчик погиб</li><li>Вкладка «Скины» в главном меню: 5 расцветок на всё оружие (Жир-бомба, Кибер-неон, Лава, Лёд, анимированная Радуга) с превью и выбором для каждого ствола</li><li>Присед исправлен: теперь опускается высота глаз, а не поворачивается голова. Управление — только кнопка (Ctrl или C, на телефоне «Прис.»)</li><li>TAB теперь показывает таблицу игроков матча: убийства, ассисты, смерти, K/D, HS%, урон за раунд, деньги, звезда лучшему фрагеру. Такая же таблица в конце матча</li></ul><b>v0.8. Детализированная карта, проработанные персонажи и отображение оружия в руках</b><ul><li>Повышена детализация карты: добавлены архитектурные карнизы и арочные ниши на стенах песчаника, деревянные ящики с обвязкой и заклёпками, металлические ворота и кирпичные секции</li><li>Карта украшена декоративными объектами: финиковые пальмы, бочки, уличные фонари со свечением, мешки с песком, кусты, указатели и разметка зон закладки A и B на земле</li><li>Персонажи стали детализированными: добавлены тени под ногами, обувь, пояс и тактический разгрузочный жилет, плечи и кисти рук, уникальные черты (очки и бандана у Андрея, седина у Бати Узая, жёлтый жилет у Узая), а также анимация шагов</li><li>На персонажах теперь видно оружие, которое они держат в руках (пистолет, Desert Eagle, MP9, AK-47, M4A4 или граната), с дульной вспышкой при выстреле и подписью оружия над головой</li></ul><b>v0.7. Чёткое разрешение, резкий прицел и правый хват оружия</b><ul><li>Повышено разрешение холста и миникарты с учётом плотности экрана</li><li>Прицел сделан чётким и контрастным с выравниванием по пикселям</li><li>Модели оружия и рук перенесены в правую нижнюю область экрана</li></ul><b>v0.6. Слоты оружия, приседание и компактные пистолеты</b><ul><li>Добавлены слоты инвентаря на клавиши 1 (автомат), 2 (пистолет) и 3 (граната) на компьютере, а также кнопки выбора слотов на экране телефона</li><li>Персонаж научился приседать: Ctrl или C на компьютере и кнопка «Прис.» на телефоне</li><li>Уменьшены 3D-модели пистолетов (P2000 и Desert Eagle) в руках от первого лица</li></ul><b>v0.5. Руки и главный экран</b><ul><li>Оружие в первом лице: обе руки на оружии, ствол направлен в перекрестие, вид сзади с перспективой</li><li>Урон: пистолеты 2 в голову или 4 в тело, автоматы 1 в голову или 2 в тело; у всех по 100 HP</li><li>Новый главный экран с портретом Андрея, кнопка «Как играть» с правилами и управлением</li></ul></div>`,[['Назад',menu]])}

  if(dead){
    const bd=c.hit>0?[255,255,255]:[95,36,34];
    for(let x=M.max(0,x0|0);x<=M.min(W-1,x0+w);x++){
      if(zb[x]<=ty)continue;
      const u=(x-x0)/w,curve=M.sin(u*PI);
      g.fillStyle=rgb(bd,k*(.75+.35*curve));
      g.fillRect(x,fl-h*curve,1,h*curve);
    }
    return;
  }

  // Палитра персонажа
  const flash=c.hit>0;
  const shirt=flash?[255,255,255]:at?[56,136,92]:[166,52,44];
  const vest=flash?[255,255,255]:c.ln=='Uzay'?[222,184,96]:at?[38,88,62]:[44,46,52];
  const pants=flash?[255,255,255]:at?[46,54,48]:[38,42,50];
  const boots=flash?[255,255,255]:[24,22,20];
  const helm=flash?[255,255,255]:at?[36,68,52]:[34,36,42];
  const skin=flash?[255,255,255]:c.ln=='Batya Uzaya'?[198,196,192]:[214,170,124];
  const stride=c.mv?M.sin(c.step)*h*.035:0;

  // Определяем относительный угол взгляда персонажа к камере (чтобы видеть куда направлено оружие)
  const toCam=M.atan2(v.y-c.y,v.x-c.x);
  const relA=angd(c.a,toCam); // 0 = смотрит прямо на нас, PI = спиной, + = влево на экране, - = вправо
  const aimDir=M.sin(relA); // -1..1 смещение ствола влево/вправо на экране
  const facingUs=M.cos(relA)>-.2;

  for(let x=M.max(0,x0|0);x<=M.min(W-1,x0+w);x++){
    if(zb[x]<=ty)continue;
    const u=(x-x0)/w;
    const shade=.82+.28*M.sin(u*PI); // объёмное затенение по цилиндру тела

    // Ноги и ботинки с анимацией шага
    if((u>.21&&u<.45)||(u>.55&&u<.79)){
      const isL=u<.5,dy=isL?stride:-stride;
      g.fillStyle=rgb(pants,k*shade);
      g.fillRect(x,top+h*.61+dy,1,h*.31);
      // Наколенники
      if(u>.25&&u<.41||u>.59&&u<.75){
        g.fillStyle=rgb(boots,k*shade);
        g.fillRect(x,top+h*.74+dy,1,h*.05);
      }
      // Ботинки
      g.fillStyle=rgb(boots,k*shade);
      g.fillRect(x,top+h*.91+dy,1,h*.09-dy);
    }

    // Руки (плечи и предплечья по бокам корпуса)
    if((u>.05&&u<.2)||(u>.8&&u<.95)){
      g.fillStyle=rgb(shirt,k*(shade*.92));
      g.fillRect(x,top+h*.25,1,h*.24);
      g.fillStyle=rgb(skin,k*(shade*.92));
      g.fillRect(x,top+h*.49,1,h*.1);
    }

    // Налокотники, нарукавная повязка команды и перчатки
    if((u>.05&&u<.2)||(u>.8&&u<.95)){
      g.fillStyle=rgb(vest,k*shade*1.25);g.fillRect(x,top+h*.235,1,h*.045);
      g.fillStyle=rgb(at?[230,190,60]:[236,236,236],k*shade);g.fillRect(x,top+h*.31,1,h*.035);
      g.fillStyle=rgb(boots,k*shade);g.fillRect(x,top+h*.54,1,h*.05);
    }
    // Торс + тактический разгрузочный жилет + пояс
    if(u>.16&&u<.84){
      g.fillStyle=rgb(shirt,k*shade);
      g.fillRect(x,top+h*.22,1,h*.4);
      // Разгрузочный жилет с карманами
      if(u>.24&&u<.76){
        g.fillStyle=rgb(vest,k*shade);
        g.fillRect(x,top+h*.25,1,h*.31);
        // Подсумки на груди
        if((u>.3&&u<.44)||(u>.56&&u<.7)){
          g.fillStyle=rgb(vest,k*shade*1.18);
          g.fillRect(x,top+h*.41,1,h*.11);
        }
      }
      // Молния, швы бронепластины, фляга и кобура
      if(M.abs(u-.5)<.012){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x,top+h*.25,1,h*.31)}
      if(u>.27&&u<.73){g.fillStyle='rgba(0,0,0,.2)';g.fillRect(x,top+h*.355,1,M.max(1,h*.008))}
      if(u>.76&&u<.84){g.fillStyle=rgb([88,100,78],k*shade);g.fillRect(x,top+h*.46,1,h*.12)}
      if(u>.16&&u<.24){g.fillStyle=rgb([30,30,34],k*shade);g.fillRect(x,top+h*.6,1,h*.1)}
      // Рюкзак со спины
      if(!facingUs&&u>.28&&u<.72){g.fillStyle=rgb(vest,k*shade*.82);g.fillRect(x,top+h*.24,1,h*.3);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x,top+h*.34,1,M.max(1,h*.012));g.fillRect(x,top+h*.46,1,M.max(1,h*.012))}
      // Ремень с пряжкой
      g.fillStyle=rgb(boots,k*shade);
      g.fillRect(x,top+h*.57,1,h*.05);
      if(u>.46&&u<.54){
        g.fillStyle=rgb([225,190,65],k);
        g.fillRect(x,top+h*.575,1,h*.04);
      }
    }

    // Голова, шлем/волосы, лицо и индивидуальные детали
    if(u>.31&&u<.69){
      // Верх головы (шлем или волосы)
      g.fillStyle=rgb(helm,k*shade);
      g.fillRect(x,top,1,h*.105);
      // Красная повязка у Андрея
      if(c.ln=='Andrey'){
        g.fillStyle=rgb([185,48,42],k*shade);
        g.fillRect(x,top+h*.08,1,h*.025);
      }
      g.fillStyle=rgb(at?[230,190,60]:[220,220,220],k*shade);g.fillRect(x,top+h*.055,1,h*.014);
      g.fillStyle=rgb(helm,k*shade*.55);g.fillRect(x,top+h*.098,1,h*.012);
      // Лицо / затылок
      g.fillStyle=rgb(facingUs?skin:helm,k*shade);
      g.fillRect(x,top+h*.105,1,h*.115);

      if(facingUs&&(u<.355||u>.645)){g.fillStyle=rgb([24,22,20],k);g.fillRect(x,top+h*.15,1,h*.07)}
      if(facingUs){
        // Очки у Андрея или глаза у остальных
        if(c.ln=='Andrey' && u>.36&&u<.64){
          g.fillStyle=rgb([25,30,36],k);
          g.fillRect(x,top+h*.13,1,h*.032);
          if((u>.38&&u<.47)||(u>.53&&u<.62)){
            g.fillStyle=rgb([110,185,220],k);
            g.fillRect(x,top+h*.134,1,h*.022);
          }
        } else if((u>.39&&u<.45)||(u>.55&&u<.61)){
          g.fillStyle=rgb([28,22,18],k);
          g.fillRect(x,top+h*.135,1,h*.022);
        }
        // Борода у Узая и усы у Бати Узая
        if(c.ln=='Uzay'&&u>.37&&u<.63){
          g.fillStyle=rgb([55,40,30],k*shade);
          g.fillRect(x,top+h*.175,1,h*.045);
        } else if(c.ln=='Batya Uzaya'&&u>.41&&u<.59){
          g.fillStyle=rgb([165,165,165],k*shade);
          g.fillRect(x,top+h*.175,1,h*.025);
        }
      }
    }
  }

  // ---- Отрисовка оружия в руках персонажа (3rd person weapon)
  const wIdx=c.slot==3?6:c.slot>=4?5:c.w;
  const gunY=top+h*.44;
  const sideShift=aimDir*w*.34;
  const gx0=sx+sideShift;
  const dirSign=aimDir>=0?1:-1;

  g.save();
  if(wIdx==6){
    const bl=h*.2,bt=M.max(1.5,h*.016),kx=gx0+dirSign*w*.1;
    g.fillStyle=rgb([46,42,38],k);g.fillRect(kx-dirSign*h*.05,gunY,h*.05,bt*1.8);
    g.fillStyle=rgb([210,215,222],k);g.beginPath();g.moveTo(kx,gunY);g.lineTo(kx+dirSign*bl,gunY+bt*.4);g.lineTo(kx,gunY+bt*1.6);g.fill();
    g.fillStyle=rgb(skin,k);g.fillRect(kx-dirSign*h*.04,gunY-bt*.2,bt*2,bt*2.2);
  } else if(wIdx==5){
    const grR=M.max(2,h*.042);
    g.fillStyle=rgb(GCOL[GKEY[c.slot]]||GCOL.gr,k);
    g.beginPath();g.arc(gx0+dirSign*w*.12,gunY,grR,0,6.3);g.fill();
    g.fillStyle=rgb([190,195,200],k);
    g.fillRect(gx0+dirSign*w*.12-grR*.4,gunY-grR*1.3,grR*.8,grR*.5);
  } else {
    // Размеры и цвета для каждого типа оружия: 0=P2000, 1=Deagle, 2=MP9, 3=AK-47, 4=M4A4
    const isRifle=wIdx>=2;
    const barrelLen=(wIdx==0?.24:wIdx==1?.30:wIdx==2?.44:wIdx==3?.62:.64)*w*(.55+.45*M.abs(aimDir));
    const gunH=M.max(2,h*(isRifle?.042:.032));
    const bodyCol=wIdx==1?[155,160,168]:wIdx==3?[55,58,64]:[38,40,45];
    const woodCol=wIdx==3?[145,92,44]:[46,48,54];

    const startX=gx0-dirSign*barrelLen*.25;
    const endX=startX+dirSign*barrelLen;
    const minX=M.min(startX,endX),lenX=M.abs(endX-startX);

    // Приклад и цевьё (для автоматов)
    if(isRifle){
      g.fillStyle=rgb(woodCol,k);
      g.fillRect(startX-dirSign*barrelLen*.22,gunY-gunH*.2,dirSign*barrelLen*.35,gunH*1.15);
      // Магазин (изогнутый у АК-47, прямой у M4A4/MP9)
      g.fillStyle=rgb([32,34,38],k);
      const magX=startX+dirSign*barrelLen*.42;
      g.fillRect(magX,gunY+gunH*.7,dirSign*M.max(2,barrelLen*.11),gunH*1.65);
    }

    // Основной ствол и затвор
    g.fillStyle=rgb(bodyCol,k);
    g.fillRect(minX,gunY,M.max(3,lenX),gunH);

    if(isRifle){g.fillStyle=rgb([24,24,28],k);g.fillRect(endX-dirSign*barrelLen*.06-(dirSign<0?gunH*.5:0),gunY-gunH*.25,gunH*.5,gunH*1.5);
      if(wIdx==4||wIdx==2){g.fillStyle=rgb([20,22,26],k);g.fillRect(startX+dirSign*barrelLen*.3-gunH*.45,gunY-gunH*.62,gunH*.9,gunH*.62);g.fillStyle=rgb([220,50,40],k);g.fillRect(startX+dirSign*barrelLen*.3-gunH*.12,gunY-gunH*.45,gunH*.25,gunH*.25)}
      else{g.fillStyle=rgb([20,22,26],k);g.fillRect(endX-dirSign*barrelLen*.12-gunH*.2,gunY-gunH*.5,gunH*.4,gunH*.5)}}
    // Светлая верхняя грань ствола для читаемости силуэта
    g.fillStyle=rgb([135,140,148],k);
    g.fillRect(minX,gunY,M.max(3,lenX),M.max(1,gunH*.32));

    // Кисти рук, удерживающие оружие
    g.fillStyle=rgb(skin,k);
    const handR=M.max(1.8,gunH*.65);
    g.fillRect(startX+dirSign*barrelLen*.15-handR*.5,gunY+gunH*.3,handR,handR);
    if(isRifle) g.fillRect(startX+dirSign*barrelLen*.58-handR*.5,gunY+gunH*.3,handR,handR);

    // Дульная вспышка, если бот/игрок стреляет
    if(c.fl>0){
      const fR=M.max(3,gunH*1.9);
      g.fillStyle='rgba(255,215,95,.95)';
      g.beginPath();g.arc(endX,gunY+gunH*.4,fR,0,6.3);g.fill();
      g.fillStyle='#fff';
      g.beginPath();g.arc(endX,gunY+gunH*.4,fR*.45,0,6.3);g.fill();
    }
  }
  g.restore();

  // Имя игрока и текущее оружие над головой
  if(zb[cx]>ty){
    const wName=c.slot>=3?GN[c.slot]:WP[c.w].sn;
    g.fillStyle=at?'#6fe0b2':'#ff8a74';
    g.font=`bold ${M.round(9.5*scaleF)}px Bahnschrift,"Arial Narrow",sans-serif`;
    g.fillText(c.n,sx,top-12*scaleF);
    g.fillStyle='rgba(235,226,204,.92)';
    g.font=`600 ${M.round(7.5*scaleF)}px Bahnschrift,"Arial Narrow",sans-serif`;
    g.fillText(`[${wName}]`,sx,top-3.5*scaleF);
  }
}

// Отрисовка декоративных объектов карты (пальмы, бочки, фонари, таблички A/B, мешки с песком, кусты)
function drawProp(o,ty,sx,fl,sh){
  const cx=M.min(W-1,M.max(0,sx|0));
  if(zb[cx]<=ty) return;
  const k=M.max(.32,1-ty/28);

  if(o.k=='barrel'){
    const bw=sh*.26,bh=sh*.38,bx0=sx-bw/2,by0=fl-bh;
    g.fillStyle=`rgba(15,10,5,${.3*k})`;g.beginPath();g.ellipse(sx,fl,bw*.55,M.max(1.5,sh*.03),0,0,6.3);g.fill();
    g.fillStyle=rgb([62,92,118],k);g.fillRect(bx0,by0,bw,bh);
    g.fillStyle=rgb([92,126,156],k);g.fillRect(bx0+bw*.2,by0,bw*.35,bh);
    g.fillStyle=rgb([32,42,52],k);
    g.fillRect(bx0,by0+bh*.25,bw,M.max(1,bh*.08));
    g.fillRect(bx0,by0+bh*.68,bw,M.max(1,bh*.08));
  } else if(o.k=='sand'){
    const sw=sh*.58,sh2=sh*.22,sx0=sx-sw/2,sy0=fl-sh2;
    g.fillStyle=rgb([158,136,92],k);g.fillRect(sx0,sy0+sh2*.45,sw,sh2*.55);
    g.fillStyle=rgb([178,155,108],k);g.fillRect(sx0+sw*.08,sy0,sw*.84,sh2*.5);
    g.strokeStyle=rgb([110,92,58],k);g.lineWidth=M.max(1,scaleF*.5);
    g.strokeRect(sx0,sy0+sh2*.45,sw*.5,sh2*.55);
    g.strokeRect(sx0+sw*.5,sy0+sh2*.45,sw*.5,sh2*.55);
    g.strokeRect(sx0+sw*.25,sy0,sw*.5,sh2*.5);
  } else if(o.k=='bush'){
    const r=sh*.18;
    g.fillStyle=rgb([68,94,48],k);g.beginPath();g.arc(sx-r*.45,fl-r*.7,r*.8,0,6.3);g.fill();
    g.fillStyle=rgb([84,114,58],k);g.beginPath();g.arc(sx+r*.4,fl-r*.65,r*.75,0,6.3);g.fill();
    g.fillStyle=rgb([98,130,66],k);g.beginPath();g.arc(sx,fl-r*.95,r*.85,0,6.3);g.fill();
  } else if(o.k=='lamp'){
    const lh=sh*.88,pw=M.max(2,sh*.035);
    g.fillStyle=rgb([42,45,50],k);g.fillRect(sx-pw/2,fl-lh,pw,lh);
    g.fillRect(sx-pw*2,fl-lh,pw*4,pw);
    g.fillStyle=`rgba(255,224,135,${.28*k})`;g.beginPath();g.arc(sx,fl-lh+pw,sh*.13,0,6.3);g.fill();
    g.fillStyle=rgb([255,236,165],M.min(1,k*1.3));g.fillRect(sx-pw*1.2,fl-lh,pw*2.4,pw*1.8);
  } else if(o.k=='sign'){
    const ph=sh*.68,pw=M.max(2,sh*.03),bw=sh*.34,bh=sh*.24;
    g.fillStyle=rgb([52,44,34],k);g.fillRect(sx-pw/2,fl-ph,pw,ph);
    g.fillStyle=rgb([196,48,38],k);g.fillRect(sx-bw/2,fl-ph-bh*.5,bw,bh);
    g.strokeStyle=rgb([235,220,190],k);g.lineWidth=M.max(1,scaleF*.7);g.strokeRect(sx-bw/2,fl-ph-bh*.5,bw,bh);
    g.fillStyle='#fff';g.font=`bold ${M.max(7,M.round(bh*.75))}px Bahnschrift,sans-serif`;
    g.fillText(o.t,sx,fl-ph+bh*.22);
  } else if(o.k=='palm'){
    const th=sh*1.22,tw=M.max(3,sh*.065);
    // Сегментированный ствол пальмы
    for(let i=0;i<7;i++){
      const y1=fl-th*(i/7),y2=fl-th*((i+1)/7),off=M.sin(i*.45)*tw*.5;
      g.fillStyle=rgb(i%2?[116,84,50]:[134,98,60],k);
      g.fillRect(sx-tw/2+off,y2,tw,y1-y2+1);
    }
    const topY=fl-th,topX=sx+M.sin(6*.45)*tw*.5,leafR=sh*.46;
    g.strokeStyle=rgb([58,104,44],k);g.lineWidth=M.max(2,sh*.032);
    for(let a=-2.4;a<=2.5;a+=.8){
      g.beginPath();g.moveTo(topX,topY);
      g.quadraticCurveTo(topX+M.cos(a)*leafR*.6,topY-leafR*.25,topX+M.cos(a)*leafR,topY+M.abs(M.sin(a))*leafR*.42);
      g.stroke();
    }
    g.strokeStyle=rgb([86,138,62],k);g.lineWidth=M.max(1.5,sh*.02);
    for(let a=-2.0;a<=2.1;a+=1.0){
      g.beginPath();g.moveTo(topX,topY);
      g.quadraticCurveTo(topX+M.cos(a)*leafR*.5,topY-leafR*.35,topX+M.cos(a)*leafR*.88,topY+M.abs(M.sin(a))*leafR*.3);
      g.stroke();
    }
  }
  propExtra(o,sx,fl,sh,k);
}
function propExtra(o,sx,fl,sh,k){
  if(o.k=='barrel'){const bw=sh*.26,bh=sh*.38,by0=fl-bh;g.fillStyle=rgb([150,170,186],k);g.beginPath();g.ellipse(sx,by0,bw*.5,M.max(1.5,sh*.03),0,0,6.3);g.fill();g.fillStyle=rgb([232,190,40],k);g.fillRect(sx-bw/2,by0+bh*.4,bw,bh*.12);g.fillStyle='rgba(120,60,20,.4)';g.fillRect(sx+bw*.2,by0+bh*.1,bw*.08,bh*.45)}
  else if(o.k=='palm'){const th=sh*1.22,tw=M.max(3,sh*.065),tx=sx+M.sin(2.7)*tw*.5,ty=fl-th;g.fillStyle=rgb([84,56,30],k);for(let i=0;i<3;i++){g.beginPath();g.arc(tx+(i-1)*tw*.55,ty+tw*.5,tw*.33,0,6.3);g.fill()}}
  else if(o.k=='bush'){const r=sh*.18;for(let i=0;i<5;i++){g.fillStyle=i%2?rgb([232,120,150],k):rgb([240,214,90],k);g.beginPath();g.arc(sx+M.sin(i*2.1)*r*.9,fl-r*(.6+.25*M.cos(i*1.7)),M.max(1,r*.12),0,6.3);g.fill()}}
  else if(o.k=='lamp'){const lh=sh*.88,pw=M.max(2,sh*.035),fk=.8+.2*M.sin(T*9+o.x*3);g.fillStyle=`rgba(255,226,140,${.16*k*fk})`;g.beginPath();g.arc(sx,fl-lh+pw,sh*.22,0,6.3);g.fill();g.fillStyle=rgb([60,64,70],k);g.fillRect(sx-pw*1.1,fl-pw*1.4,pw*2.2,pw*1.4)}
  else if(o.k=='pot'){const pw=sh*.2,ph2=sh*.3,x0=sx-pw/2,y0=fl-ph2;g.fillStyle=`rgba(15,10,5,${.3*k})`;g.beginPath();g.ellipse(sx,fl,pw*.6,M.max(1.5,sh*.03),0,0,6.3);g.fill();
    g.fillStyle=rgb([176,92,54],k);g.beginPath();g.moveTo(x0+pw*.12,fl);g.lineTo(x0+pw*.88,fl);g.lineTo(x0+pw,y0+ph2*.3);g.lineTo(x0+pw*.8,y0);g.lineTo(x0+pw*.2,y0);g.lineTo(x0,y0+ph2*.3);g.fill();
    g.fillStyle=rgb([214,140,86],k);g.fillRect(x0+pw*.18,y0+ph2*.3,pw*.18,ph2*.6);g.fillStyle=rgb([60,110,120],k);g.fillRect(x0+pw*.02,y0+ph2*.42,pw*.96,ph2*.1);g.fillStyle=rgb([40,28,18],k);g.fillRect(x0+pw*.2,y0,pw*.6,ph2*.06)}
  else if(o.k=='bench'){const bw=sh*.5,bh=sh*.2,x0=sx-bw/2;g.fillStyle=`rgba(15,10,5,${.3*k})`;g.beginPath();g.ellipse(sx,fl,bw*.55,M.max(1.5,sh*.03),0,0,6.3);g.fill();
    g.fillStyle=rgb([62,48,34],k);g.fillRect(x0+bw*.08,fl-bh*.6,bw*.07,bh*.6);g.fillRect(x0+bw*.85,fl-bh*.6,bw*.07,bh*.6);
    g.fillStyle=rgb([150,104,58],k);g.fillRect(x0,fl-bh*.7,bw,bh*.18);g.fillStyle=rgb([176,128,74],k);g.fillRect(x0,fl-bh*.7,bw,bh*.06);g.fillStyle=rgb([120,82,44],k);g.fillRect(x0,fl-bh*1.2,bw,bh*.14)}
}

function drawCrosshair(){
  const cx=M.round(W/2),cy=M.round(H/2);
  const gap=M.round((3+(1-P.cr)*1.5+kick*2.2)*scaleF);
  const len=M.round(5.5*scaleF);
  const thick=M.max(2,M.round(1.4*scaleF));
  const col=hm>0?'#ff3828':'#ffffff';
  g.save();
  g.fillStyle='rgba(0,0,0,.78)';
  const pad=1;
  g.fillRect(cx-gap-len-pad,cy-thick/2-pad,len+pad*2,thick+pad*2);
  g.fillRect(cx+gap-pad,cy-thick/2-pad,len+pad*2,thick+pad*2);
  g.fillRect(cx-thick/2-pad,cy-gap-len-pad,thick+pad*2,len+pad*2);
  g.fillRect(cx-thick/2-pad,cy+gap-pad,thick+pad*2,len+pad*2);
  g.fillStyle=col;
  g.fillRect(cx-gap-len,cy-thick/2,len,thick);

function sendChat(q){if(NET.host)chatIn(NET.pl.find(p=>p.id==0),q);else sendHost({t:'chat',m:q})}
function chatOpen(){NET.chat=1;for(const k in K)K[k]=0;const i=$('cin');i.style.display='block';i.value='';i.focus();document.exitPointerLock&&document.exitPointerLock()}
function chatClose(){NET.chat=0;$('cin').style.display='none';$('cin').blur();if(st=='game'&&!pz)lock()}
$('cin').addEventListener('keydown',e=>{e.stopPropagation();if(e.key=='Enter'){const v=$('cin').value.trim();if(v)sendChat(v);chatClose()}else if(e.key=='Escape')chatClose()});
const lobSend=()=>{const v=$('lin').value.trim();if(v)sendChat(v);$('lin').value=''};

$('ljt1').onclick=()=>pickTeam(1);$('ljt0').onclick=()=>pickTeam(0);
